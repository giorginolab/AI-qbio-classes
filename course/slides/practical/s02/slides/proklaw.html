<section id="proklaw" style="background:#FFFFFF;color:#2D3340;font-family:'Source Sans 3', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:56px">
<h2 style="font-family:'Source Sans 3', Arial, sans-serif;font-weight:700;line-height:1.1;color:#002060;font-size:64px;line-height:1.05;width:1500px">In prokaryotes, genes are proportional to genome size</h2>
<div style="display:flex;flex-direction:row;gap:64px">
<div style="flex:1;display:flex;flex-direction:column;gap:8px;border-top:3px solid #78B3E0;padding:24px 0px 0px 0px"><p style="font-size:120px;font-weight:700;line-height:1;color:#002060">0.964</p><p style="font-size:32px">exponent</p></div>
<div style="flex:1;display:flex;flex-direction:column;gap:8px;border-top:3px solid #8779B6;padding:24px 0px 0px 0px"><p style="font-size:120px;font-weight:700;line-height:1;color:#002060">0.98</p><p style="font-size:32px">R²</p></div>
<div style="flex:1;display:flex;flex-direction:column;gap:8px;border-top:3px solid #417F45;padding:24px 0px 0px 0px"><p style="font-size:120px;font-weight:700;line-height:1;color:#002060">942</p><p style="font-size:32px">genes per Mb (median)</p></div>
</div>
<p style="font-size:44px;line-height:1.3;width:1500px">About one gene per 1 000 bases: a prokaryotic genome is genes packed side by side.</p>
<aside>genes = 985 · size^0.964. The law is almost exact.</aside>
</section>
